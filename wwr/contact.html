<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
    <meta name="description" content="Contact page with Navigation and addresses">
    <meta name="author" content="Kofi Agbenyegah Ahiataku">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="Company logo" width="100">
        </div>
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About Us</a>
            <a href="trips.html" class="nav-link">Trips</a>
            <a href="contact.html" class="nav-link">Contact Us</a>
        </nav>
    </header>
    <main>

        <div class="info-container">
            <h1>White Water Rafting Company</h1>
            <p>Acc 4673 New York Beach street</p>
            <p> Rochester, New York</p>
            <p>+1 991 943 8453</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="contact-us">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7999.630479726163!2d-77.64949220746071!3d43.142920026108804!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89d6b3059614b353%3A0x5a001ffc4125e61e!2sRochester%2C%20NY%2C%20USA!5e0!3m2!1sen!2sae!4v1795766515415!5m2!1sen!2sae" width="350" height="350" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <fieldset class="label-narrow">
                    <label for="fullname">Name</label>
                    <input type="text" name="fullname" id="fullname" placeholder="Full name">
                </fieldset>
                <fieldset class="label-narrow">
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email" placeholder="Email Address">
                </fieldset>
                <fieldset class="label-narrow">
                    <label>Message purpose</label>
                    <div class="radios">
                        <label for="general"><input type="radio" name="purpose" id="general" value="general">General Inquiry</label>
                        <label for="reservation"><input type="radio" name="purpose" id="reservation" value="reservation">Reservation Question</label>
                        <label for="website"><input type="radio" name="purpose" id="website" value="website">Website Suggestion </label>
                    </div>
                </fieldset>
                <fieldset>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here" rows="7"></textarea>
                </fieldset>
                <fieldset>
                    <label for="subscribe"><input type="checkbox" name="subscribe" id="subscribe">Please Subscribe me to the monthly newsletter</label>
                </fieldset>
                <button type="submit">Get in Touch</button>
            </form>
        </div>
        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/kofi.jpeg" alt="Operations Manager">
                    <figcaption>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/exec.jpg" alt="Customer Service Officer">
                    <figcaption>Customer Service Officer</figcaption>
                </figure>
                <figure>
                    <img src="images/marketing.jpg" alt="Equipment Technician">
                    <figcaption>Equipment Technician</figcaption>
                </figure>
                <figure>
                    <img src="images/boss.jpg" alt="Safety Kayaker">
                    <figcaption>Safety Kayaker</figcaption>
                </figure>
                <figure>
                    <img src="images/RANS.jpeg" alt="River Rafting Guide">
                    <figcaption>River Rafting Guide</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy;2026 - White Water Rifting Company | Kofi Agbenyegah Ahiataku</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.svg" alt="facebook"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.svg" alt="instagram"></a>
            <a href="https://x.com/?lang=en"><img src="images/x-bw.svg" alt="twitter"></a>
        </nav>
    </footer>
</body>

</html>
